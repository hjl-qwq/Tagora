# installer.toml —— Tagora 的安装清单
#
# 用 typora_plugin 的 installer 安装本插件：
#   TyporaPluginInstaller.exe            （GUI：插件包目录 = 本文件所在目录，plugin 目录 = <Typora>/resources/plugin）
#   typora-plugin-installer-cli --source . --target "<Typora>/resources/plugin" --dry-run
#
# 字段含义见 installer/README.md。清单只描述"装什么、写什么配置"，
# 安装器负责复制文件 + 合并 settings.user.toml（复制前先备份为 .bak）。
#
# 安装后的可见入口：
#   - 右键菜单最后一个分组（__INTERACTIVE_PLUGINS__）末尾，标题取自下面的 name
#   - [settings] HOTKEY 配置的快捷键（默认 ctrl+shift+k）
# 本插件不占用 action_buttons 的编辑器角落按钮，因此不需要改动插件系统的默认配置。

[plugin]
# 固定名：必须与 plugin/ 下的目录名一致（plugin/tagora/）。
id = "tagora"

# 显示名：写进 NAME，同时是右键菜单与面板标题的文字。
name = "标签管理"

version = "0.1.0"
description = "文件级标签管理：为知识库里的 Markdown 建立可搜索的标签索引。"
author = "hjl-qwq"
homepage = "https://github.com/hjl-qwq/Tagora"
min_typora = "0.9.98"

[install]
# 核心文件根目录（相对本文件）。
source = "plugin"

# 只安装 plugin/tagora/，避免把 plugin/ 下将来可能出现的其它内容一并铺到目标目录。
files = ["tagora"]

# 目标已存在同名文件时覆盖（升级/重装时的期望行为）。
overwrite = true

# 写入 settings.user.toml：打开插件并补齐下面的默认配置。
settings = true

# false = 只补缺失的键，不覆盖用户已经改过的值。
settings_overwrite = false

[menu]
# auto = 安装器写 [right_click_menu] FIND_LOST_PLUGINS = true，
#        插件系统会把已加载但未被 MENUS 列出的插件追加到右键菜单末尾。
mode = "auto"

# 插件读取的所有配置键都必须在这里给出默认值：第三方插件没有 settings.default.toml
# 可以落脚，this.config 就是安装器写进 settings.user.toml 的这一段。
[settings]
# 打开/关闭标签面板的快捷键（留空字符串表示不注册）。
HOTKEY = "ctrl+shift+k"

# 在 Typora 文件树里显示"该文件的标签数"角标。
SHOW_TREE_BADGE = true

# 标签索引文件（相对知识库根目录）。它所在的目录必须在 EXCLUDE_DIRS 里，否则扫描会索引到自己。
INDEX_FILE = ".kbdatabase/tags.json"

# 参与索引的扩展名。
MARKDOWN_EXT = [".md", ".markdown", ".mdown", ".mkd", ".mkdn", ".mdwn"]

# 扫描时跳过的目录名。
EXCLUDE_DIRS = [".git", ".kbdatabase"]

# 输入标签时最多提示多少个候选。
SUGGESTION_LIMIT = 10
